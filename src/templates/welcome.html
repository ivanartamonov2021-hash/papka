<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h1 {
            color: #28a745;
            margin-top: 0;
        }
        p {
            color: #333;
        }
        .balance {
            margin: 25px 0;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .balance-label {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .balance-value {
            font-size: 28px;
            font-weight: bold;
            color: #28a745;
        }
        a.logout {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #dc3545;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        a.logout:hover {
            background-color: #b02a37;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Добро пожаловать{% if name %}, {{ name }}{% endif %}!</h1>
        <p>Вы успешно вошли в систему.</p>

        <div class="balance">
            <span class="balance-label">Ваш баланс:</span>
            <span class="balance-value">1 000 ₽</span>
        </div>

        <a class="logout" href="/logout">Выйти</a>
    </div>
</body>
</html>
